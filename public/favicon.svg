<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 夜空背景漸層 -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- 星光漸層 -->
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 微光暈效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 圓角夜空底色 -->
  <rect width="64" height="64" rx="16" fill="url(#nightSky)" />

  <!-- 主星芒（四角星） -->
  <path d="M32 8 C32 23, 39 30, 54 30 C39 30, 32 37, 32 52 C32 37, 25 30, 10 30 C25 30, 32 23, 32 8 Z" fill="url(#starGlow)" filter="url(#glow)" />

  <!-- 右上角小伴星 -->
  <path d="M48 12 C48 15.5, 50.5 18, 54 18 C50.5 18, 48 20.5, 48 24 C48 20.5, 45.5 18, 42 18 C45.5 18, 48 15.5, 48 12 Z" fill="#FEF08A" opacity="0.9" />

  <!-- 左下角微光點 -->
  <circle cx="17" cy="47" r="2" fill="#FFFFFF" opacity="0.75" />
</svg>